name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - agent/3d-learning-poc

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint, test, and type-check
        run: npm run check

      - name: Build production site
        run: npm run build

      - name: Upload build for inspection
        uses: actions/upload-artifact@v5
        with:
          name: shibari-pages-build
          path: dist
          if-no-files-found: error
          retention-days: 7

